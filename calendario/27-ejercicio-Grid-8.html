<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Septiembre 2025</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 60px;
      gap: 5px;
      width: 600px;
      margin: 20px auto;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .day {
      font-weight: bold;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .num {
      background: #e1f5fe;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #ccc;
    }

    /* Encabezados en la fila 1 */
    .day:nth-child(1)  { grid-column: 1; grid-row: 1; }
    .day:nth-child(2)  { grid-column: 2; grid-row: 1; }
    .day:nth-child(3)  { grid-column: 3; grid-row: 1; }
    .day:nth-child(4)  { grid-column: 4; grid-row: 1; }
    .day:nth-child(5)  { grid-column: 5; grid-row: 1; }
    .day:nth-child(6)  { grid-column: 6; grid-row: 1; }
    .day:nth-child(7)  { grid-column: 7; grid-row: 1; }

    /* Números: fila 2 */
    .num:nth-of-type(1) { grid-column: 1; grid-row: 2; }
    .num:nth-of-type(2) { grid-column: 2; grid-row: 2; }
    .num:nth-of-type(3) { grid-column: 3; grid-row: 2; }
    .num:nth-of-type(4) { grid-column: 4; grid-row: 2; }
    .num:nth-of-type(5) { grid-column: 5; grid-row: 2; }
    .num:nth-of-type(6) { grid-column: 6; grid-row: 2; }
    .num:nth-of-type(7) { grid-column: 7; grid-row: 2; }

    /* Fila 3 */
    .num:nth-of-type(8)  { grid-column: 1; grid-row: 3; }
    .num:nth-of-type(9)  { grid-column: 2; grid-row: 3; }
    .num:nth-of-type(10) { grid-column: 3; grid-row: 3; }
    .num:nth-of-type(11) { grid-column: 4; grid-row: 3; }
    .num:nth-of-type(12) { grid-column: 5; grid-row: 3; }
    .num:nth-of-type(13) { grid-column: 6; grid-row: 3; }
    .num:nth-of-type(14) { grid-column: 7; grid-row: 3; }

    /* Fila 4 */
    .num:nth-of-type(15) { grid-column: 1; grid-row: 4; }
    .num:nth-of-type(16) { grid-column: 2; grid-row: 4; }
    .num:nth-of-type(17) { grid-column: 3; grid-row: 4; }
    .num:nth-of-type(18) { grid-column: 4; grid-row: 4; }
    .num:nth-of-type(19) { grid-column: 5; grid-row: 4; }
    .num:nth-of-type(20) { grid-column: 6; grid-row: 4; }
    .num:nth-of-type(21) { grid-column: 7; grid-row: 4; }

    /* Fila 5 */
    .num:nth-of-type(22) { grid-column: 1; grid-row: 5; }
    .num:nth-of-type(23) { grid-column: 2; grid-row: 5; }
    .num:nth-of-type(24) { grid-column: 3; grid-row: 5; }
    .num:nth-of-type(25) { grid-column: 4; grid-row: 5; }
    .num:nth-of-type(26) { grid-column: 5; grid-row: 5; }
    .num:nth-of-type(27) { grid-column: 6; grid-row: 5; }
    .num:nth-of-type(28) { grid-column: 7; grid-row: 5; }

    /* Fila 6 */
    .num:nth-of-type(29) { grid-column: 1; grid-row: 6; }
    .num:nth-of-type(30) { grid-column: 2; grid-row: 6; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Encabezados -->
    <div class="day">L</div>
    <div class="day">M</div>
    <div class="day">M</div>
    <div class="day">J</div>
    <div class="day">V</div>
    <div class="day">S</div>
    <div class="day">D</div>

    <!-- Días -->
    <div class="num">1</div>
    <div class="num">2</div>
    <div class="num">3</div>
    <div class="num">4</div>
    <div class="num">5</div>
    <div class="num">6</div>
    <div class="num">7</div>
    <div class="num">8</div>
    <div class="num">9</div>
    <div class="num">10</div>
    <div class="num">11</div>
    <div class="num">12</div>
    <div class="num">13</div>
    <div class="num">14</div>
    <div class="num">15</div>
    <div class="num">16</div>
    <div class="num">17</div>
    <div class="num">18</div>
    <div class="num">19</div>
    <div class="num">20</div>
    <div class="num">21</div>
    <div class="num">22</div>
    <div class="num">23</div>
    <div class="num">24</div>
    <div class="num">25</div>
    <div class="num">26</div>
    <div class="num">27</div>
    <div class="num">28</div>
    <div class="num">29</div>
    <div class="num">30</div>
  </div>
</body>
</html>
